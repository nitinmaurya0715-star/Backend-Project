{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Campus Polls{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'polls/style.css' %}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{% url 'polls:index' %}">Campus Polls</a>
  <nav><a href="{% url 'polls:index' %}">Home</a><a href="/admin/">Admin</a></nav>
</header>
<main class="container">
  {% if messages %}
    {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
<footer> Django Polling/Voting Application · Learning project</footer>
</body>
</html>
